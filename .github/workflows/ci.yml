name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Python contract, API and SDK tests (no paid inference)
        run: python -m pytest backend/tests -q
      - name: Verify Python imports compile
        run: python -m compileall -q backend -x '/\.venv/'
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Frontend tests (no paid inference)
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Secret audit
        run: npm run audit:secrets
      - name: Validate frontend static assets (no deployment)
        run: npx wrangler deploy --dry-run
